site_name: مستندات فنی TCU — خودروی متصل سایپا
site_description: معماری، Contractها و کد اسکلت Firmware واحد TCU پروژه خودروی متصل سایپا
repo_url: http://192.168.4.251/connectedcar/connectedcarfirmware
repo_name: connectedcarfirmware
edit_uri: edit/master/docs/

theme:
  name: material
  language: fa
  direction: rtl
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: حالت تیره
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: حالت روشن
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - tables
  - footnotes
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

